plugins {
    id 'org.springframework.boot' version '4.0.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'ua.ucu.replicatedlog'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    // Spring Boot BOM manages dependency versions for every module (including plain-Java `core`)
    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.8'
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Spring Boot applications (everything except the plain-Java `core` library)
configure(subprojects.findAll { it.name != 'core' }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation project(':core')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('jar') {
        enabled = false
    }
}
