services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      REPLICATION_SECONDARIES: http://sec1:8080,http://sec2:8080
    ports:
      - "8080:8080"
    depends_on:
      - sec1
      - sec2

  sec1:
    build:
      context: .
      dockerfile: sec/Dockerfile
    environment:
      SEC_NODE_ID: sec1
      SEC_DELAY_MS: 0
    ports:
      - "8081:8080"

  sec2:
    build:
      context: .
      dockerfile: sec/Dockerfile
    environment:
      SEC_NODE_ID: sec2
      SEC_DELAY_MS: 7000
    ports:
      - "8082:8080"
